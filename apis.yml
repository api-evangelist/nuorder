name: NuORDER
description: >-
  NuORDER by Lightspeed is a global B2B commerce platform for wholesale buying
  and selling between brands and retailers. It combines a fully-branded wholesale
  eCommerce storefront with account-specific pricing and discounts, an
  Assortments planning tool for data-driven buying and reduced markdowns, and a
  Marketplace that connects buyers to 3,000+ brands across fashion, footwear, and
  apparel. NuORDER exposes a partner-gated REST API at api.nuorder.com for syncing
  products, orders, catalogs, and customer data with ERP, PIM, and other commerce
  systems. Acquired by Lightspeed in 2021, it is used by brands including
  Arc'teryx, Kendra Scott, TOMS, Barbour, and Canada Goose.
